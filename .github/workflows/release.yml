name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run verify:release-version

      - name: Compile, lint, and test
        run: npm test

      - name: Build VSIX
        run: npm run package -- --out notebook-cell-organizer.vsix

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: notebook-cell-organizer-${{ github.ref_name }}
          path: notebook-cell-organizer.vsix
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" notebook-cell-organizer.vsix --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
